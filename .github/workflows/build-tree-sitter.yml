name: Build Tree-sitter CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tree-sitter version
        required: true
        default: "0.26.13"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: tree-sitter-linux-x86_64

          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: tree-sitter-linux-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Add Rust target
        run: |
          rustup target add ${{ matrix.target }}

      - name: Build Tree-sitter CLI
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cargo install tree-sitter-cli \
            --version "$VERSION" \
            --locked \
            --target "${{ matrix.target }}" \
            --root "$RUNNER_TEMP/tree-sitter"

          cp \
            "$RUNNER_TEMP/tree-sitter/bin/tree-sitter" \
            "$RUNNER_TEMP/${{ matrix.asset }}"

          chmod +x "$RUNNER_TEMP/${{ matrix.asset }}"

          sha256sum "$RUNNER_TEMP/${{ matrix.asset }}" \
            > "$RUNNER_TEMP/${{ matrix.asset }}.sha256"

      - name: Test binary
        run: |
          "$RUNNER_TEMP/${{ matrix.asset }}" --version
          file "$RUNNER_TEMP/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ runner.temp }}/${{ matrix.asset }}
            ${{ runner.temp }}/${{ matrix.asset }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="tree-sitter-cli-v${VERSION}"

          if ! gh release view "$TAG" \
            --repo "${{ github.repository }}" >/dev/null 2>&1; then

            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Tree-sitter CLI v${VERSION}" \
              --notes "Statically linked Linux Tree-sitter CLI binaries."
          fi

          gh release upload "$TAG" \
            artifacts/* \
            --repo "${{ github.repository }}" \
            --clobber
