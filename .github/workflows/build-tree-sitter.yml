name: Build Tree-sitter CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tree-sitter version
        required: true
        default: "0.26.13"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: tree-sitter-linux-x86_64

          - runner: ubuntu-24.04-arm
            asset: tree-sitter-linux-arm64

    runs-on: ${{ matrix.runner }}

    container:
      image: ubuntu:20.04

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            libclang-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal

      - name: Build Tree-sitter CLI
        env:
          VERSION: ${{ inputs.version }}
        run: |
          . "$HOME/.cargo/env"

          cargo install tree-sitter-cli \
            --version "$VERSION" \
            --locked \
            --root "$RUNNER_TEMP/tree-sitter"

          cp \
            "$RUNNER_TEMP/tree-sitter/bin/tree-sitter" \
            "$RUNNER_TEMP/${{ matrix.asset }}"

          chmod +x "$RUNNER_TEMP/${{ matrix.asset }}"

          sha256sum "$RUNNER_TEMP/${{ matrix.asset }}" \
            > "$RUNNER_TEMP/${{ matrix.asset }}.sha256"

      - name: Test binary
        run: |
          "$RUNNER_TEMP/${{ matrix.asset }}" --version

          file "$RUNNER_TEMP/${{ matrix.asset }}"

          ldd "$RUNNER_TEMP/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ runner.temp }}/${{ matrix.asset }}
            ${{ runner.temp }}/${{ matrix.asset }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="tree-sitter-cli-v${VERSION}"

          if ! gh release view "$TAG" \
            --repo "${{ github.repository }}" >/dev/null 2>&1; then

            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Tree-sitter CLI v${VERSION}" \
              --notes "Portable Linux Tree-sitter CLI binaries built against glibc 2.31."
          fi

          gh release upload "$TAG" \
            artifacts/* \
            --repo "${{ github.repository }}" \
            --clobber
